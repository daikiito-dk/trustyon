services:
  api:
    build: ./services/api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://trustyon:trustyon@db:5432/trustyon?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: trustyon
      POSTGRES_PASSWORD: trustyon
      POSTGRES_DB: trustyon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustyon -d trustyon"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
